name: Build and review
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:helper
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: habit-calendar-release-${{ runner.os }}
          path: release/
          if-no-files-found: error
