name: Build and review
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Identify source and reject a stale lockfile
        run: node scripts/check-lockfile.mjs
      - name: Install Windows timezone database for optional helper tests
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run check
      - run: npm run test:helper
      - uses: actions/upload-artifact@v7
        with:
          name: habit-calendar-release-${{ runner.os }}
          path: release/
          if-no-files-found: error
