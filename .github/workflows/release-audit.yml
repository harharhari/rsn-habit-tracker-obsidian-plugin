name: Audit published manifest
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to compare with the current default branch
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify requested version
        run: node scripts/check-release-tag.mjs
      - name: Install dependencies from the tagged lockfile
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Build and check the tagged source
        run: npm run check
      - name: Audit published manifest and all three downloaded assets
        run: node scripts/remote-release.mjs audit
